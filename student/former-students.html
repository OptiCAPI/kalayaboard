<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রাক্তন অ্যালবাম - কালাইয়া বোর্ড সপ্রাবি</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap');
        
        :root {
            --primary-red: #E63946;
            --gold: #FFD700;
            --dark-blue: #1D3557;
            --light-bg: #F8EDEB;
        }

        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background-color: var(--light-bg); 
            background-image: url('images/alpana_bg.jpg'); 
            background-size: 400px;
            background-repeat: repeat;
            background-attachment: fixed;
            background-blend-mode: overlay;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(248, 237, 235, 0.94); 
            z-index: -1;
        }

        .album-header {
            background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%);
            color: white;
            padding: 50px 20px;
            text-align: center;
            border-radius: 0 0 50px 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }

        .batch-section {
            background: #ffffff;
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 50px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .section-title {
            font-family: 'Baloo Da 2', cursive;
            font-weight: 700;
            color: var(--dark-blue);
            border-left: 5px solid var(--primary-red);
            padding-left: 15px;
            margin-bottom: 25px;
        }

        .pp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 20px;
        }

        /* --- Individual Card Core Style --- */
        .pp-card {
            background: #fff;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            border: 1px solid #f0f0f0;
            transition: all 0.4s ease;
        }

        .pp-img-wrapper {
            width: 100%;
            aspect-ratio: 3/4;
            overflow: hidden;
            border-radius: 8px;
            background: #fdfdfd;
            margin-bottom: 8px;
        }

        .pp-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .student-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2b2d42;
            margin: 5px 0 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- 2026: ZOOM HOVER --- */
        .batch-2026 { border: 2px solid var(--gold); background: #fffdf5; }
        .hover-zoom:hover {
            transform: scale(1.15);
            border-color: var(--gold);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4);
            z-index: 10;
        }

        /* --- 2025: TILT HOVER --- */
        .hover-tilt:hover {
            transform: translateY(-10px) rotate(3deg);
            border-color: #457b9d;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        /* --- 2024: GLOW HOVER --- */
        .hover-glow:hover {
            box-shadow: 0 0 20px rgba(230, 57, 70, 0.5);
            border-color: var(--primary-red);
            transform: translateY(-5px);
        }

        /* --- 21-23: SIMPLE LIFT --- */
        .hover-lift:hover {
            transform: translateY(-8px);
            background: #f8f9fa;
        }

        @media (max-width: 576px) {
            .pp-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .student-name { font-size: 0.7rem; }
        }
            
        /* --- Main Container Styling --- */
        #top-showcase {
            padding: 40px 0;
            background: transparent; /* Allows your Alpana background to show */
        }
    
        .batch-card-main {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 35px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }
    
        /* --- 2027 FUN STYLE (Neon & Pulse) --- */
        .style-2027 {
            border: 3px solid #00f2ff;
            background: linear-gradient(135deg, #ffffff 0%, #e0fbfc 100%);
        }
        
        .future-badge {
            background: #E63946;
            color: white;
            padding: 4px 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    
        /* --- 2026 PREMIUM STYLE (Gold & Elegant) --- */
        .style-2026 {
            border: 3px solid #ffd700;
            background: linear-gradient(to bottom, #fffef2, #ffffff);
        }
    
        /* --- The Grid (15-30 Photos) --- */
        .pp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
        }
    
        .pp-card {
            background: #fff;
            border-radius: 15px;
            padding: 6px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #eee;
        }
    
        /* Unique Hover for 2027 */
        .pp-card-2027:hover {
            transform: scale(1.15) rotate(3deg);
            border-color: #00f2ff;
            box-shadow: 0 10px 20px rgba(0, 242, 255, 0.3);
        }
    
        /* Unique Hover for 2026 */
        .pp-card-2026:hover {
            transform: scale(1.1) translateY(-10px);
            border-color: #ffd700;
            box-shadow: 0 15px 30px rgba(255, 215, 0, 0.4);
        }
    
        .pp-img-box {
            width: 100%;
            aspect-ratio: 3/4;
            overflow: hidden;
            border-radius: 10px;
            background: #f8f9fa;
            margin-bottom: 5px;
        }
    
        .pp-img-box img {
            width: 100%; height: 100%; object-fit: cover;
        }
    
        .pp-name {
            font-size: 0.8rem;
            font-weight: 700;
            color: #1d3557;
            margin: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }
    
        @media (max-width: 576px) {
            .pp-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .pp-name { font-size: 0.65rem; }
        }
    </style>
        
</head>
<body>

<header class="album-header">
        <div class="container">
            <h1 class="display-5 fw-bold animate__animated animate__fadeInDown">স্মৃতিময় প্রাক্তন অ্যালবাম 🎓</h1>
            <p class="lead">কালাইয়া বোর্ড সরকারি প্রাথমিক বিদ্যালয়</p>
        </div>
    </header>
    
    <div class="container">
        <section id="top-showcase" class="container">
        <div class="batch-card-main style-2027 animate__animated animate__bounceInDown">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
                <div>
                    <h4 class="mb-0" style="color: #0077b6; font-weight: 800;">
                        <i class="fas fa-rocket me-2 animate__animated animate__infinite animate__pulse"></i> 
                        ভবিষ্যৎ ব্যাচ ২০২৭
                    </h4>
                </div>
                <span class="future-badge">Coming Soon</span>
            </div>
    
            <div class="pp-grid">
                <script>
                    // Showing 15-30 slots for 2027
                    for(let i=1; i<=18; i++) {
                        document.write(`
                            <div class="pp-card pp-card-2027">
                                <div class="pp-img-box" style="border: 2px dashed #00f2ff;">
                                    <img src="https://ui-avatars.com/api/?name=Future+${i}&background=00f2ff&color=fff" alt="Star">
                                </div>
                                <p class="pp-name">ভবিষ্যৎ তারকা</p>
                            </div>
                        `);
                    }
                </script>
            </div>
        </div>
    
        <div class="batch-card-main style-2026 animate__animated animate__fadeInUp">
            <div class="d-flex align-items-center mb-4 border-bottom pb-2">
                <i class="fas fa-crown me-3 text-warning fa-2x"></i>
                <h4 class="mb-0" style="color: #1d3557; font-weight: 800;">চলতি ব্যাচ ২০২৬ (আমাদের গর্ব)</h4>
            </div>
    
            <div class="pp-grid">
                <script>
                    // এখানে ছাত্র-ছাত্রীদের নামগুলো সিরিয়াল অনুযায়ী লিখুন
                    const students2026 = [
                        "আব্দুর রহমান", "সাদিয়া আক্তার", "নিলয় হাসান", "মালিহা ইসলাম", 
                        "রাকিব হোসেন", "সুমাইয়া জান্নাত", "তামিম ইকবাল", "ফাতেমা তুজ জোহরা"
                        // এভাবে ৩০ জনের নাম লিখতে পারবেন...
                    ];
                
                    // লুপটি এখন অটোমেটিক ছবি এবং নাম নিয়ে নেবে
                    for(let i = 0; i < students2026.length; i++) {
                        document.write(`
                            <div class="pp-card pp-card-2026">
                                <div class="pp-img-box">
                                    <img src="gallery/2026/${i+1}.jpg" alt="students2026" 
                                         onerror="this.src='https://ui-avatars.com/api/?name=S&background=random'">
                                </div>
                                <p class="pp-name">${students2026[i]}</p>
                            </div>
                        `);
                    }
                </script>
            </div>
        </div>
    
    </section>

    <section class="batch-section animate__animated animate__fadeInLeft">
        <h3 class="section-title"><i class="fas fa-graduation-cap me-2 text-primary"></i> ব্যাচ ২০২৫</h3>
        <div class="pp-grid">
            <script>
                // এখানে ছাত্র-ছাত্রীদের নামগুলো সিরিয়াল অনুযায়ী লিখুন
                const students2026 = [
                    "আব্দুর রহমান", "সাদিয়া আক্তার", "নিলয় হাসান", "মালিহা ইসলাম", 
                    "রাকিব হোসেন", "সুমাইয়া জান্নাত", "তামিম ইকবাল", "ফাতেমা তুজ জোহরা"
                    // এভাবে ৩০ জনের নাম লিখতে পারবেন...
                ];
            
                // লুপটি এখন অটোমেটিক ছবি এবং নাম নিয়ে নেবে
                for(let i = 0; i < students2025.length; i++) {
                    document.write(`
                        <div class="pp-card pp-card-2025">
                            <div class="pp-img-box">
                                <img src="gallery/2025/${i+1}.jpg" alt="students2025" 
                                     onerror="this.src='https://ui-avatars.com/api/?name=S&background=random'">
                            </div>
                            <p class="pp-name">${students2025[i]}</p>
                        </div>
                    `);
                }
            </script>
        </div>
    </section>

    <section class="batch-section animate__animated animate__fadeInLeft">
        <div class="section-header">
            <i class="fas fa-award me-3 text-primary fa-2x"></i>
            <h3>ব্যাচ ২০২৪</h3>
        </div>
        <div class="pp-grid">
            <script>
                // এখানে ২০২৪ ব্যাচের ছাত্র-ছাত্রীদের নাম লিখুন
                const students2024 = [
                    "শানজিদা আক্তার, "মো: হাসিব", "জান্নাতুল ফেরদৌস", "আরিফ বিল্লাহ",
                    "তানজিলা আক্তার", "সাকিব আল হাসান", "মারুফ হোসেন" 
                    // আরও নাম এখানে কমা দিয়ে যোগ করুন...
                ];
    
                for(let i = 0; i < students2024.length; i++) {
                    document.write(`
                        <div class="pp-card hover-lift">
                            <div class="pp-img-box">
                                <img src="gallery/2024/${i+1}.jpg" alt="${students2024[i]}" 
                                     onerror="this.src='https://ui-avatars.com/api/?name=${students2024[i]}&background=457b9d&color=fff'">
                            </div>
                            <p class="pp-name">${students2024[i]}</p>
                        </div>
                    `);
                }
            </script>
        </div>
    </section>
    
    <section class="batch-section animate__animated animate__fadeInRight">
        <div class="section-header">
            <i class="fas fa-history me-3 text-success fa-2x"></i>
            <h3>ব্যাচ ২০২৩</h3>
        </div>
        <div class="pp-grid">
            <script>
                // এখানে ২০২৩ ব্যাচের নামগুলো লিখুন
                const students2023 = [
                    "চাঁদিনী আক্তার", "মারিয়াম আক্তার", "তানভীর", "মহিমা", "তানহা আক্তার", "তামিমুল", "নোবেল", "জিনিয়া", "আয়শা",
                   "শর্মি", "তাইয়েবা", "সাদিয়া", "শিউলি", "চাঁদনী", "মফিজুল", "মরিয়ম", "ফাতেমা", "সুপ্ত", "সামিরা", "রহিম", "রহমাতুল্লাহ","স্বজন", "শিমুল"
                ];
    
                for(let i = 0; i < students2023.length; i++) {
                    document.write(`
                        <div class="pp-card hover-lift">
                            <div class="pp-img-box">
                                <img src="gallery/2023/${i+1}.jpg" alt="${students2023[i]}" 
                                     onerror="this.src='https://ui-avatars.com/api/?name=${students2023[i]}&background=2a9d8f&color=fff'">
                            </div>
                            <p class="pp-name">${students2023[i]}</p>
                        </div>
                    `);
                }
            </script>
        </div>
    </section>

    <section class="batch-section animate__animated animate__bounceIn">
        <h3 class="section-title text-info"><i class="fas fa-history me-2"></i> ব্যাচ ২০২২</h3>
        <div class="pp-grid">
            <script>
                for(let i=1; i<=12; i++) {
                    document.write(`<div class="pp-card hover-lift"><div class="pp-img-wrapper"><img src="https://ui-avatars.com/api/?name=22_${i}&background=00afb9&color=fff"></div><p class="student-name">শিক্ষার্থী ${i}</p></div>`);
                }
            </script>
        </div>
    </section>

    <section class="batch-section animate__animated animate__rollIn">
        <h3 class="section-title text-secondary"><i class="fas fa-history me-2"></i> ব্যাচ ২০২১</h3>
        <div class="pp-grid">
            <script>
                for(let i=1; i<=12; i++) {
                    document.write(`<div class="pp-card hover-lift"><div class="pp-img-wrapper"><img src="https://ui-avatars.com/api/?name=21_${i}&background=6d6875&color=fff"></div><p class="student-name">শিক্ষার্থী ${i}</p></div>`);
                }
            </script>
        </div>
    </section>

</div>

<footer class="mt-5 py-4 bg-dark text-white text-center">
    <p>© ২০২৬ কালাইয়া বোর্ড সরকারি প্রাথমিক বিদ্যালয় | সকল স্বত্ব সংরক্ষিত</p>
</footer>

</body>
</html>
