<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>বাংলাদেশের প্রাথমিক বিদ্যালয়ের ইংরেজি শব্দ শিক্ষা (Class 1-5)</title>
    <style>
        :root {
            --primary: #FF5722;
            --primary-dark: #E64A19;
            --secondary: #4CAF50;
            --accent: #FFEB3B;
            --bg-color: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-main: #212121;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'SolaimanLipi', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Sticky Navigation Header */
        .sticky-nav-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        header {
            background: linear-gradient(135deg, #FF7043, #FF5722);
            color: white;
            padding: 12px 15px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
        }

        /* Class Selection Tabs Bar */
        .class-tabs-bar {
            background: #FFFFFF;
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 2px solid #FFE0B2;
            -webkit-overflow-scrolling: touch;
        }

        .class-tabs-bar::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            padding: 8px 16px;
            border: 2px solid #FFE0B2;
            background: #FFF8E1;
            color: var(--primary-dark);
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            font-size: 14px;
            flex-shrink: 0;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Class Banner */
        .class-banner {
            background: #E8F5E9;
            color: #2E7D32;
            padding: 10px 20px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 2px solid #C8E6C9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Words Grid Container */
        .container {
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        /* Word Card Component */
        .word-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 4px solid #FFE0B2;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .word-card:active {
            transform: scale(0.97);
            border-color: var(--primary);
        }

        .img-container {
            height: 200px;
            width: 100%;
            background-color: #FFF8E1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .audio-icon-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            color: var(--primary);
        }

        .card-content {
            padding: 15px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .word-en {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary-dark);
            text-transform: capitalize;
        }

        .word-sound {
            font-size: 14px;
            color: #D84315;
            font-weight: bold;
            background: #FBE9E7;
            padding: 3px 10px;
            border-radius: 10px;
            display: inline-block;
            margin: 2px auto;
        }

        .word-bn {
            font-size: 19px;
            font-weight: bold;
            color: #2E7D32;
        }

        /* Next Words Button */
        .load-more-container {
            text-align: center;
            margin: 30px 0 50px 0;
        }

        .next-btn {
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.2s;
        }

        .next-btn:active {
            transform: scale(0.95);
        }

        /* Fullscreen Zoom-In Modal */
        .zoom-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 300;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            touch-action: none;
        }

        .zoom-card {
            background: white;
            width: 100%;
            max-width: 480px;
            border-radius: 25px;
            overflow: hidden;
            text-align: center;
            animation: zoomIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .zoom-img-box {
            height: 280px;
            width: 100%;
            background-color: #FFF8E1;
        }

        .zoom-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .zoom-en {
            font-size: 36px;
            font-weight: 900;
            color: var(--primary-dark);
            margin-top: 10px;
        }

        .zoom-sound {
            font-size: 18px;
            color: #D84315;
            font-weight: bold;
            background: #FBE9E7;
            padding: 4px 16px;
            border-radius: 15px;
            display: inline-block;
            margin: 6px 0;
        }

        .zoom-bn {
            font-size: 26px;
            font-weight: bold;
            color: #2E7D32;
        }

        .zoom-close-hint {
            color: white;
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .img-container { height: 140px; }
            .word-en { font-size: 18px; }
            .word-sound { font-size: 12px; }
            .word-bn { font-size: 15px; }
            .zoom-img-box { height: 200px; }
            .zoom-en { font-size: 28px; }
            .zoom-sound { font-size: 15px; }
            .zoom-bn { font-size: 20px; }
        }
    </style>
</head>

<!-- Sticky Header & Class Tabs Navigation -->
<div class="sticky-nav-wrapper">
    <header>

<!-- Dynamic Cards Container -->
<div class="container">

    </div>
</div>

    // State Variables
    let currentClass = 'Class 1';
    let currentIndex = 0;
    const batchSize = 12;
    let autoZoomTimer = null;
    let isHolding = false;

    window.onload = () => {
        renderClassWords(true);
        setupHoldEvents();
    };

    // Corrected Switch Class Function
    function switchClass(className, btnElement) {
        currentClass = className;
        
        // Update Active Class Tab Style
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        // Update Title Header
        const bnClassNames = {
            'Class 1': 'শ্রেণি ১ (Class 1)',
            'Class 2': 'শ্রেণি ২ (Class 2)',
            'Class 3': 'শ্রেণি ৩ (Class 3)',
            'Class 4': 'শ্রেণি ৪ (Class 4)',
            'Class 5': 'শ্রেণি ৫ (Class 5)'
        };
        document.getElementById('current-class-title').innerText = `${bnClassNames[className]} শব্দের তালিকা`;

        // Reset and re-render grid
        renderClassWords(true);
    }

    function renderClassWords(reset = false) {
        const container = document.getElementById('cards-container');
        if (reset) {
            currentIndex = 0;
            container.innerHTML = '';
        }

        const words = nctbDatabase[currentClass] || [];
        const nextBatch = words.slice(currentIndex, currentIndex + batchSize);

        nextBatch.forEach(item => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.onclick = () => triggerCardZoomAndAudio(item);

            card.innerHTML = `
                <div class="img-container">
                    <img src="${item.img}" alt="${item.en}" loading="lazy">
                    <div class="audio-icon-overlay">🔊</div>
                </div>
                <div class="card-content">
                    <div class="word-en">${item.en}</div>
                    <div class="word-sound">উচ্চারণ: ${item.sound}</div>
                    <div class="word-bn">${item.bn}</div>
                </div>
            `;
            container.appendChild(card);
        });

        currentIndex += nextBatch.length;
        document.getElementById('word-count-badge').innerText = `প্রদর্শিত: ${Math.min(currentIndex, words.length)} / ${words.length}`;
    }

    function loadNextBatch() {
        const words = nctbDatabase[currentClass] || [];
        if (currentIndex < words.length) {
            renderClassWords(false);
        } else {
            alert(`${currentClass}-এর সকল শব্দ দেখানো সম্পূর্ণ হয়েছে!`);
        }
    }

    // High-Pitch Nursery Child Voice Generator
    function speakWordInChildVoice(text) {
        if (!('speechSynthesis' in window)) return;
        
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        
        // Pick best matching soft female or child base voice
        const preferredVoice = voices.find(v => 
            v.lang.startsWith('en') && (
                v.name.toLowerCase().includes('kid') ||
                v.name.toLowerCase().includes('child') ||
                v.name.toLowerCase().includes('samantha') ||
                v.name.toLowerCase().includes('victoria') ||
                v.name.toLowerCase().includes('zira') ||
                v.name.toLowerCase().includes('google us english')
            )
        );

        if (preferredVoice) utterance.voice = preferredVoice;
        utterance.lang = 'en-US';
        
        // High Pitch Settings for Nursery Tone
        utterance.pitch = 1.95; // Extra high pitch frequency shift
        utterance.rate = 0.72;   // Slow pace for toddler clear audio
        utterance.volume = 1.0;

        window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // Modal Zoom and Audio Trigger
    function triggerCardZoomAndAudio(item) {
        clearTimeout(autoZoomTimer);
        isHolding = false;

        speakWordInChildVoice(item.en);

        document.getElementById('zoom-img').src = item.img;
        document.getElementById('zoom-en').innerText = item.en;
        document.getElementById('zoom-sound').innerText = `উচ্চারণ: ${item.sound}`;
        document.getElementById('zoom-bn').innerText = item.bn;

        const overlay = document.getElementById('zoom-overlay');
        overlay.style.display = 'flex';

        scheduleAutoZoomOut(2800);
    }

    function scheduleAutoZoomOut(delayMs) {
        clearTimeout(autoZoomTimer);
        autoZoomTimer = setTimeout(() => {
            if (!isHolding) closeZoom();
        }, delayMs);
    }

    function closeZoom() {
        clearTimeout(autoZoomTimer);
        document.getElementById('zoom-overlay').style.display = 'none';
        isHolding = false;
    }

    function setupHoldEvents() {
        const overlay = document.getElementById('zoom-overlay');

        const startHold = () => {
            isHolding = true;
            clearTimeout(autoZoomTimer);
        };

        const endHold = () => {
            if (isHolding) {
                isHolding = false;
                scheduleAutoZoomOut(800);
            }
        };

        overlay.addEventListener('touchstart', startHold, { passive: true });
        overlay.addEventListener('touchend', endHold);
        overlay.addEventListener('mousedown', startHold);
        overlay.addEventListener('mouseup', endHold);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeZoom();
        });
    }
</script>

</body>
</html>
